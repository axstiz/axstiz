name: Mirror site to axstiz.github.io

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check DEPLOY_TOKEN secret
        run: |
          if [ -z "${{ secrets.DEPLOY_TOKEN }}" ]; then
            echo "::error::DEPLOY_TOKEN is EMPTY or not set"
            exit 1
          fi
          echo "DEPLOY_TOKEN is set"
      - uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: axstiz/axstiz.github.io
          publish_branch: main
          publish_dir: site